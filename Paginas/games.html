<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestión de juegos de GameStore.">
    <title>GameStore - Juegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/estilos.css">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <main id="contenido" class="container-fluid py-3">
        <center>
            <h1>GameStore</h1>
            <a href="../index.html">HomeStore</a>
            <form id="dep">
                <h2 class="titulo">Juegos</h2>
                <section>
                    <div class="campos">
                        <label for="codigo">Codigo:</label>
                        <input type="text" id="codigo" placeholder="ej: PROD001" maxlength="30" autocomplete="off">

                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" placeholder="ej: minecraft" maxlength="80" autocomplete="off">

                        <label for="descripcion">Descripcion:</label>
                        <textarea id="descripcion" rows="4" maxlength="250"></textarea>

                        <label for="precio">Precio:</label>
                        <input type="number" id="precio" placeholder="0.00" min="0" step="0.01">

                        <label for="stock">Stock:</label>
                        <input type="number" id="stock" placeholder="x00" min="0" step="1">
                    </div>
                    <div class="botones">
                        <input class="btn btn_agregar" type="button" value="Agregar" data-action="agregar">
                        <input class="btn btn_modificar" type="button" value="Modificar" data-action="modificar">
                        <input class="btn btn_eliminar" type="button" value="Eliminar" data-action="eliminar">
                        <input class="btn btn_limpiar" type="button" value="Limpiar" data-action="limpiar">
                    </div>
                </section>
            </form>

            <div class="listado">
                <label for="lista-games">Juegos registrados</label><br>
                <select id="lista-games" size="6" aria-label="Lista de juegos registrados"></select>
            </div>
        </center>
    </main>
    <footer class="site-footer">GameStore</footer>
    <script type="module" src="../Dominio/Controladora/gamesControladores.js"></script>
</body>
</html>
