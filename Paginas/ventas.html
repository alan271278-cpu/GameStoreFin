<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestión de ventas de GameStore.">
    <title>GameStore - Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/estilos.css">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <main id="contenido" class="container-fluid py-3">
        <center>
            <h1>GameStore</h1>
            <a href="../index.html">HomeStore</a>
            <form id="dep">
                <h2 class="titulo">Ventas</h2>
                <section>
                    <div class="campos">
                        <label for="codigo">Código:</label>
                        <input type="number" id="codigo" min="1" step="1">
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha">
                        <label for="codigo-vendedor">Vendedor:</label>
                        <select id="codigo-vendedor"></select>
                        <label for="codigo-game">Game:</label>
                        <select id="codigo-game"></select>
                        <label for="precio-game">Precio:</label>
                        <input type="number" id="precio-game" disabled aria-readonly="true">
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" min="1" step="1" inputmode="numeric">
                        <label for="total">Total:</label>
                        <input type="text" id="total" disabled aria-readonly="true">
                    </div>
                    <div class="botones">
                        <input class="btn btn_agregar" type="button" value="Agregar" data-action="agregar">
                        <input class="btn btn_modificar" type="button" value="Modificar" data-action="modificar">
                        <input class="btn btn_eliminar" type="button" value="Eliminar" data-action="eliminar">
                        <input class="btn btn_limpiar" type="button" value="Limpiar" data-action="limpiar">
                    </div>
                </section>
            </form>

            <div class="listado">
                <label for="lista-ventas">Ventas registradas</label><br>
                <select id="lista-ventas" size="6" aria-label="Lista de ventas registradas"></select>
            </div>
        </center>
    </main>
    <footer class="site-footer">GameStore</footer>
    <script type="module" src="../Dominio/Controladora/ventasControladores.js"></script>
</body>
</html>
