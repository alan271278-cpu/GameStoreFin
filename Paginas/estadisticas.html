<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Estadísticas de GameStore.">
    <title>GameStore - Estadísticas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/estilos.css">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <main id="contenido" class="container-fluid py-3">
        <center>
            <h1>GameStore</h1>
            <a href="../index.html">HomeStore</a>
            <form id="dep">
                <h2 class="titulo">Estadísticas</h2>
                <section>
                    <div class="campos">
                        <label for="totalRecaudado">Total recaudado:</label>
                        <input type="text" id="totalRecaudado" disabled aria-readonly="true">
                        <label for="masVendido">Juego más vendido:</label>
                        <input type="text" id="masVendido" disabled aria-readonly="true">
                        <label for="mejorVendedor">Mejor vendedor:</label>
                        <input type="text" id="mejorVendedor" disabled aria-readonly="true">
                    </div>
                </section>
            </form>

            <div class="listado">
                <label for="games-con-stock">Juegos con Stock</label><br>
                <select id="games-con-stock" size="6" aria-label="Juegos con stock"></select>
            </div>
        </center>
    </main>
    <footer class="site-footer">GameStore</footer>
    <script type="module" src="../Dominio/Controladora/estadisticasControladores.js"></script>
</body>
</html>
