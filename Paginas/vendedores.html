<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestión de vendedores de GameStore.">
    <title>GameStore - Vendedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/estilos.css">
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <main id="contenido" class="container-fluid py-3">
        <center>
            <h1>GameStore</h1>
            <a href="../index.html">HomeStore</a>
            <form id="dep">
                <h2 class="titulo">ABM Vendedores</h2>
                <section>
                    <div class="campos">
                        <label for="codigo">Código:</label>
                        <input type="text" id="codigo" maxlength="30" autocomplete="off">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" maxlength="80" autocomplete="name">
                        <label for="cedula">Cédula:</label>
                        <input type="text" id="cedula" maxlength="20" inputmode="numeric" autocomplete="off">
                    </div>
                    <div class="botones">
                        <input class="btn btn_agregar" type="button" value="Agregar" data-action="agregar">
                        <input class="btn btn_modificar" type="button" value="Modificar" data-action="modificar">
                        <input class="btn btn_eliminar" type="button" value="Eliminar" data-action="eliminar">
                        <input class="btn btn_limpiar" type="button" value="Limpiar" data-action="limpiar">
                    </div>
                </section>
            </form>

            <div class="listado">
                <label for="lista-vendedores">Vendedores registrados</label><br>
                <select id="lista-vendedores" size="6" aria-label="Lista de vendedores registrados"></select>
            </div>
        </center>
    </main>
    <footer class="site-footer">GameStore</footer>
    <script type="module" src="../Dominio/Controladora/vendedoresControladores.js"></script>
</body>
</html>
